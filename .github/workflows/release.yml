name: release
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run GoReleaser in snapshot mode without publishing"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  pull-requests: write

jobs:
  goreleaser:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }

      - uses: actions/setup-go@v5
        with: { go-version: "1.23.x" }

      - name: GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run && 'release --snapshot --clean --skip=publish --skip=announce' || 'release --clean' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}                 # for release in this repo
          HOMEBREW_GITHUB_TOKEN: ${{ secrets.HOMEBREW_GITHUB_TOKEN }} # PAT with write on tap

  verify-release:
    needs: goreleaser
    runs-on: ubuntu-22.04
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4

      - name: Verify published release and Homebrew tap sync
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: make release-verify TAG=${GITHUB_REF_NAME}

  brew-smoke:
    needs: goreleaser
    runs-on: macos-latest
    if: github.event_name == 'push'
    steps:
      - name: Smoke install via Homebrew tap
        run: |
          brew update
          brew install intentregistry/tap/intent-cli
          intent --version
