name: Change request
description: Propose a change that may be outside maintenance scope
title: "change: "
labels:
  - enhancement
body:
  - type: dropdown
    id: scope
    attributes:
      label: Scope classification
      description: Maintenance mode allows only critical categories by default
      options:
        - Security fix
        - Core lifecycle reliability improvement
        - CI/release reliability improvement
        - Critical docs drift fix
        - Out of maintenance scope
    validations:
      required: true

  - type: textarea
    id: objective
    attributes:
      label: Objective
      description: What problem are we solving?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: Keep it concise and concrete
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Expected impact
      description: Reliability/release/team-throughput impact
    validations:
      required: true

  - type: input
    id: approval
    attributes:
      label: Maintainer approval reference (required if out of scope)
      description: Link to explicit approval comment/decision
      placeholder: "https://github.com/..."
